<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  @font-face {
    font-family: 'VCR OSD Mono';
    src: local('VCR OSD Mono');
    font-display: swap;
  }
  :root {
    --bg: #000000; --fg: #c8c8c8; --dim: #4a4a4a; --white: #f2f2f2;
    --red: #ff4d4d; --blu: #4d9fff; --grn: #4dff88; --ylw: #ffd24d; --line: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: 'VCR OSD Mono', 'Courier New', monospace; font-size: 15px; letter-spacing: 0.3px; }
  body { display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; height: 100dvh;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  #topbar { padding: 14px 16px 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
  #gcname .label { color: var(--dim); }
  #votes-left { color: var(--dim); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 8px; }
  .who { flex-shrink: 0; }
  .who.red { color: var(--red); } .who.blu { color: var(--blu); }
  .who.grn { color: var(--grn); } .who.ylw { color: var(--ylw); }
  .body { color: var(--fg); word-break: break-word; }
  .sys { color: var(--white); }
  #inputwrap { position: relative; border-top: 1px solid var(--line); flex-shrink: 0; }
  #autofill { position: absolute; bottom: 100%; left: 0; right: 0; background: #000;
    border: 1px solid var(--line); border-bottom: none; display: none; flex-direction: column; }
  #autofill.open { display: flex; }
  .ac-item { padding: 8px 16px; color: var(--dim); display: flex; justify-content: space-between; cursor: pointer; }
  .ac-item .cmd { color: var(--fg); }
  .ac-item.active { background: #0e0e0e; }
  .ac-item.active .cmd { color: var(--white); }
  .ac-item .desc { color: var(--dim); font-size: 12px; }
  #inputbar { display: flex; align-items: center; padding: 12px 16px; gap: 8px; }
  #prompt { color: var(--dim); flex-shrink: 0; }
  #input { flex: 1; background: transparent; border: none; outline: none; color: var(--fg);
    font-family: inherit; font-size: inherit; letter-spacing: inherit; caret-color: var(--fg); }
  #input::placeholder { color: var(--dim); }
  #input:disabled { color: var(--dim); }
  #cooldown { color: var(--dim); font-size: 12px; flex-shrink: 0; min-width: 24px; text-align: right; }
  #votebanner { display: none; padding: 8px 16px; border-top: 1px solid var(--line);
    color: var(--white); font-size: 13px; justify-content: space-between; flex-shrink: 0; }
  #votebanner.open { display: flex; }
  #votebanner .tally { color: var(--dim); }
  #gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; }
  #gate button { background: transparent; border: 1px solid var(--line); color: var(--fg);
    font-family: inherit; font-size: 15px; padding: 10px 24px; cursor: pointer; }
  #gate button:hover { border-color: var(--dim); }
  #gate .status { color: var(--dim); font-size: 13px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="gate">
  <button id="findGcBtn">find a gc</button>
  <div class="status" id="gateStatus"></div>
</div>

<div id="chatui" style="display:none; flex-direction:column; flex:1; min-height:0;">
  <div id="topbar">
    <div id="gcname"><span class="label">gc:</span> <span id="gcnameVal"></span></div>
    <div id="votes-left"></div>
  </div>
  <div id="log"></div>
  <div id="votebanner"></div>
  <div id="inputwrap">
    <div id="autofill"></div>
    <div id="inputbar">
      <span id="prompt">&gt;</span>
      <input id="input" autocomplete="off" placeholder="say something" />
      <span id="cooldown"></span>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---- fill these in from your Supabase project (Settings → API) ----
const SUPABASE_URL = 'https://qtakdzwswctsqfyedorw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wZfpMp4VeZvXDQJFEn5ZRA_mBnbSRzv';
// ---------------------------------------------------------------------

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gate = document.getElementById('gate');
const gateStatus = document.getElementById('gateStatus');
const findGcBtn = document.getElementById('findGcBtn');
const chatui = document.getElementById('chatui');
const log = document.getElementById('log');
const input = document.getElementById('input');
const votesLeftEl = document.getElementById('votes-left');
const votebanner = document.getElementById('votebanner');
const autofill = document.getElementById('autofill');
const cooldownEl = document.getElementById('cooldown');
const gcnameVal = document.getElementById('gcnameVal');

let me = null;         // auth user
let myColor = null;
let currentRoom = null;
let currentVote = null;
let messagesChannel = null;
let votesChannel = null;
let roomChannel = null;
const SLOW_MODE_MS = 3000;
let lastSentAt = 0;

// ---------- auth: anonymous, no names, matches the whole premise ----------
async function ensureAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { me = session.user; return; }
  const { data, error } = await supabase.auth.signInAnonymously();
  if (error) { gateStatus.textContent = 'auth error: ' + error.message; return; }
  me = data.user;
}

async function findExistingRoom() {
  const { data } = await supabase
    .from('room_members')
    .select('room_id, color, rooms(id, name, status)')
    .eq('user_id', me.id)
    .eq('status', 'active')
    .limit(1)
    .maybeSingle();
  if (data && data.rooms?.status === 'active') {
    return { roomId: data.room_id, color: data.color, name: data.rooms.name };
  }
  return null;
}

findGcBtn.addEventListener('click', async () => {
  findGcBtn.disabled = true;
  gateStatus.textContent = 'connecting...';
  await ensureAuth();

  const existing = await findExistingRoom();
  if (existing) {
    await enterRoom(existing.roomId, existing.color, existing.name);
    return;
  }

  gateStatus.textContent = 'waiting for 3 more...';
  await supabase.rpc('join_queue');

  // poll every few seconds until the matchmaker (scheduled edge function) places us
  const poll = setInterval(async () => {
    const room = await findExistingRoom();
    if (room) {
      clearInterval(poll);
      await enterRoom(room.roomId, room.color, room.name);
    }
  }, 4000);
});

async function enterRoom(roomId, color, name) {
  currentRoom = roomId;
  myColor = color;
  gate.style.display = 'none';
  chatui.style.display = 'flex';
  gcnameVal.textContent = name;
  input.focus();

  await loadHistory();
  await loadRoomMeta();
  subscribeRealtime();
}

// ---------- message log rendering ----------
function addMsg(who, text) {
  const row = document.createElement('div');
  row.className = 'msg';
  const whoEl = document.createElement('span');
  whoEl.className = 'who ' + who;
  whoEl.textContent = who.toUpperCase();
  const bodyEl = document.createElement('span');
  bodyEl.className = 'body';
  bodyEl.textContent = text;
  row.append(whoEl, bodyEl);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}
function addSys(text) {
  const row = document.createElement('div');
  row.className = 'msg sys';
  row.textContent = text;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}
function addSysVote(who) {
  const row = document.createElement('div');
  row.className = 'msg sys';
  const label = document.createElement('span');
  label.textContent = 'SYS: ';
  const whoEl = document.createElement('span');
  whoEl.className = 'who ' + who;
  whoEl.textContent = who.toUpperCase();
  row.append(label, whoEl, document.createTextNode(' voted.'));
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

async function loadHistory() {
  const { data } = await supabase
    .from('messages')
    .select('color, body, created_at')
    .eq('room_id', currentRoom)
    .order('created_at', { ascending: true })
    .limit(200);
  log.innerHTML = '';
  (data ?? []).forEach(m => addMsg(m.color, m.body));
}

async function loadRoomMeta() {
  const { data: room } = await supabase.from('rooms').select('*').eq('id', currentRoom).single();
  const msLeft = new Date(room.next_vote_available_at) - new Date();
  votesLeftEl.textContent = msLeft > 0 ? 'votes: cooling down' : 'votes: 1 available';

  const { data: openVote } = await supabase
    .from('votes').select('*').eq('room_id', currentRoom).eq('status', 'open').maybeSingle();
  if (openVote) { currentVote = openVote; renderVoteBanner(); }
}

function voteDescription(v, targetColor) {
  if (v.type === 'eject') return `eject ${targetColor?.toUpperCase() ?? '???'}`;
  if (v.type === 'dissolve') return 'dissolve the gc';
  return 'open the refill slot';
}

async function renderVoteBanner() {
  if (!currentVote) { votebanner.classList.remove('open'); votebanner.innerHTML = ''; return; }
  let targetColor = null;
  if (currentVote.type === 'eject') {
    const { data } = await supabase.from('room_members').select('color').eq('id', currentVote.target_member_id).single();
    targetColor = data?.color;
  }
  const { count } = await supabase
    .from('vote_casts').select('*', { count: 'exact', head: true }).eq('vote_id', currentVote.id);
  votebanner.classList.add('open');
  votebanner.innerHTML = '';
  const left = document.createElement('span');
  left.textContent = 'VOTE: ' + voteDescription(currentVote, targetColor);
  const right = document.createElement('span');
  right.className = 'tally';
  right.textContent = (count ?? 0) + ' voted';
  votebanner.append(left, right);
}

// ---------- realtime ----------
function subscribeRealtime() {
  messagesChannel = supabase.channel('room-messages-' + currentRoom)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoom}` },
      payload => addMsg(payload.new.color, payload.new.body))
    .subscribe();

  votesChannel = supabase.channel('room-votes-' + currentRoom)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'votes', filter: `room_id=eq.${currentRoom}` },
      async payload => {
        if (payload.eventType === 'INSERT') {
          currentVote = payload.new;
          let targetColor = null;
          if (currentVote.type === 'eject') {
            const { data } = await supabase.from('room_members').select('color').eq('id', currentVote.target_member_id).single();
            targetColor = data?.color;
          }
          addSys('SYS: a vote has been started to ' + voteDescription(currentVote, targetColor) + '.');
          renderVoteBanner();
        } else if (payload.eventType === 'UPDATE') {
          if (payload.new.status !== 'open') {
            addSys(payload.new.status === 'passed' ? 'SYS: vote passed.' : 'SYS: vote did not pass.');
            currentVote = null;
          }
          renderVoteBanner();
        }
      })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'vote_casts' },
      async payload => {
        const { data } = await supabase.from('room_members').select('color').eq('id', payload.new.member_id).single();
        if (data) addSysVote(data.color);
        renderVoteBanner();
      })
    .subscribe();

  roomChannel = supabase.channel('room-state-' + currentRoom)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${currentRoom}` },
      payload => {
        if (payload.new.status === 'dissolving') addSys('SYS: gc will dissolve in 24h.');
        if (payload.new.status === 'dissolved') addSys('SYS: this gc has dissolved.');
      })
    .subscribe();
}

// ---------- slow mode ----------
function startCooldown() {
  lastSentAt = Date.now();
  input.disabled = true;
  tick();
}
function tick() {
  const remaining = SLOW_MODE_MS - (Date.now() - lastSentAt);
  if (remaining <= 0) { cooldownEl.textContent = ''; input.disabled = false; input.focus(); return; }
  cooldownEl.textContent = Math.ceil(remaining / 1000) + 's';
  setTimeout(tick, 100);
}

// ---------- slash commands + autocomplete ----------
const COMMANDS_BASE = [
  { cmd: '/vote eject <color>', desc: 'start a vote to remove a member' },
  { cmd: '/vote dissolve', desc: 'start a vote to end the gc' },
  { cmd: '/vote refill', desc: 'start a vote to open the empty slot' },
  { cmd: '/leave', desc: 'leave this gc' },
];
const COMMANDS_VOTING = [
  { cmd: '/yes', desc: 'vote yes on the active vote' },
  { cmd: '/no', desc: 'vote no on the active vote' },
];
function currentCommands() { return currentVote ? COMMANDS_VOTING : COMMANDS_BASE; }

let acIndex = -1, acMatches = [];
function renderAutofill(matches) {
  acMatches = matches; acIndex = matches.length ? 0 : -1;
  autofill.innerHTML = '';
  if (!matches.length) { autofill.classList.remove('open'); return; }
  matches.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'ac-item' + (i === acIndex ? ' active' : '');
    const cmdEl = document.createElement('span'); cmdEl.className = 'cmd'; cmdEl.textContent = m.cmd;
    const descEl = document.createElement('span'); descEl.className = 'desc'; descEl.textContent = m.desc;
    item.append(cmdEl, descEl);
    item.addEventListener('mousedown', e => { e.preventDefault(); applyAutofill(m); });
    autofill.appendChild(item);
  });
  autofill.classList.add('open');
}
function updateAutofillHighlight() {
  [...autofill.children].forEach((el, i) => el.classList.toggle('active', i === acIndex));
}
function applyAutofill(match) {
  input.value = match.cmd.split(' <')[0] + ' ';
  closeAutofill(); input.focus();
}
function closeAutofill() { autofill.classList.remove('open'); acMatches = []; acIndex = -1; }

input.addEventListener('input', () => {
  const val = input.value;
  if (val.startsWith('/')) {
    const cmds = currentCommands();
    if (val.includes(' ')) {
      const base = val.split(' ')[0];
      renderAutofill(cmds.filter(c => c.cmd.startsWith(base)));
    } else {
      renderAutofill(cmds.filter(c => c.cmd.startsWith(val)));
    }
  } else closeAutofill();
});

input.addEventListener('keydown', async e => {
  if (autofill.classList.contains('open')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = (acIndex + 1) % acMatches.length; updateAutofillHighlight(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = (acIndex - 1 + acMatches.length) % acMatches.length; updateAutofillHighlight(); return; }
    if (e.key === 'Tab') { e.preventDefault(); if (acIndex >= 0) applyAutofill(acMatches[acIndex]); return; }
    if (e.key === 'Escape') { closeAutofill(); return; }
    if (e.key === 'Enter' && acIndex >= 0 && !input.value.includes(' ')) { e.preventDefault(); applyAutofill(acMatches[acIndex]); return; }
  }
  if (e.key !== 'Enter' || input.disabled) return;

  const raw = input.value.trim();
  if (!raw) return;
  input.value = '';
  closeAutofill();

  if (raw.startsWith('/vote')) {
    const [, type, colorArg] = raw.split(' ');
    try {
      if (type === 'eject' && colorArg) {
        const { data: target } = await supabase.from('room_members')
          .select('id').eq('room_id', currentRoom).eq('color', colorArg).eq('status', 'active').single();
        if (!target) { addSys('SYS: no active member with that color.'); }
        else await supabase.rpc('start_vote', { p_room_id: currentRoom, p_type: 'eject', p_target_member_id: target.id }).throwOnError();
      } else if (type === 'dissolve') {
        await supabase.rpc('start_vote', { p_room_id: currentRoom, p_type: 'dissolve' }).throwOnError();
      } else if (type === 'refill') {
        await supabase.rpc('start_vote', { p_room_id: currentRoom, p_type: 'refill' }).throwOnError();
      } else {
        addSys('SYS: usage: /vote eject <color> · /vote dissolve · /vote refill');
      }
    } catch (err) { addSys('SYS: ' + err.message); }
    startCooldown(); return;
  }

  if (raw === '/leave') {
    try { await supabase.rpc('leave_room', { p_room_id: currentRoom }).throwOnError(); addSys('SYS: you have left the gc.'); }
    catch (err) { addSys('SYS: ' + err.message); }
    startCooldown(); return;
  }

  if (raw === '/yes' || raw === '/no') {
    if (!currentVote) { addSys('SYS: no vote in progress.'); startCooldown(); return; }
    try { await supabase.rpc('cast_vote', { p_vote_id: currentVote.id, p_choice: raw === '/yes' }).throwOnError(); }
    catch (err) { addSys('SYS: ' + err.message); }
    startCooldown(); return;
  }

  try { await supabase.rpc('send_message', { p_room_id: currentRoom, p_body: raw }).throwOnError(); }
  catch (err) { addSys('SYS: ' + err.message); }
  startCooldown();
});

// auto-resume a session on reload
(async () => {
  await ensureAuth();
  const existing = await findExistingRoom();
  if (existing) await enterRoom(existing.roomId, existing.color, existing.name);
})();
</script>
</body>
</html>
